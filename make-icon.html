<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Icon Generator</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
    button { padding: 10px 14px; margin-right: 8px; }
    canvas { border: 1px solid #ddd; display: block; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>PWA Icon Generator</h1>
  <p>ボタンを押すとPNGをダウンロードできます。</p>

  <button id="dl192">Download 192x192</button>

  <canvas id="c" width="192" height="192"></canvas>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");

    function draw(size) {
      canvas.width = canvas.height = size;

      // 背景
      ctx.fillStyle = "#2563eb";
      ctx.fillRect(0, 0, size, size);

      // 内側カード
      const pad = Math.round(size * 0.10);
      ctx.fillStyle = "#ffffff";
      roundRect(ctx, pad, pad, size - pad*2, size - pad*2, Math.round(size*0.12));
      ctx.fill();

      // 文字
      ctx.fillStyle = "#2563eb";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `700 ${Math.round(size * 0.26)}px system-ui, -apple-system, Segoe UI, sans-serif`;
      ctx.fillText("PWA", size / 2, size / 2);
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function download(size) {
      draw(size);
      canvas.toBlob((blob) => {
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "icon-192.png";
        a.click();
        URL.revokeObjectURL(a.href);
      }, "image/png");
    }

    draw(192);
    document.getElementById("dl192").addEventListener("click", () => download(192));
  </script>
</body>
</html>
