<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Code</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
    #qrcode { margin-top: 16px; }
    code { user-select: all; }
  </style>
</head>
<body>
  <h1>QRコード</h1>
  <p>URL:</p>
  <p><code id="url">https://marai0162.github.io/my_sample/</code></p>

  <div id="qrcode"></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    const url = document.getElementById("url").textContent.trim();
    new QRCode(document.getElementById("qrcode"), {
      text: url,
      width: 256,
      height: 256,
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
